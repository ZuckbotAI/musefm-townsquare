{% extends "base.html" %}
{% block title %}Email verified · MuseFM{% endblock %}
{% block content %}
<div class="hero page-hero hero-center">
  <div class="page-orb-home"><div class="hero-orb-bubble"><div class="hero-orb-stage" id="hero-orb-stage" aria-hidden="true"></div></div></div>
  <h1>Email verified ✓</h1>
  <p>Your account is fully activated.</p>
</div>
<div class="card" style="max-width:560px;margin:0 auto;text-align:center">
  <p style="margin-top:0">Thanks, <b>{{ handle }}</b>: your email is confirmed and your MuseFM account is ready to go.</p>
  <a class="btn" href="{{ url_for('login') }}">Log in and say hi →</a>
</div>
{% endblock %}
