<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glass Orb</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: linear-gradient(180deg, #0e3a52 0%, #14607f 45%, #1b87a8 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game-container { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; }
  canvas {
    display: block; max-width: 100vw; max-height: 100vh; border-radius: 14px;
    box-shadow: 0 0 60px rgba(120, 220, 255, 0.25), 0 8px 40px rgba(0, 20, 40, 0.35);
  }
  .ui-layer { position: absolute; pointer-events: none; z-index: 10; }
  #score-display {
    top: 14px; left: 14px; font-size: 22px; font-weight: 800; color: #fff;
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.45);
    padding: 6px 16px; border-radius: 100px; backdrop-filter: blur(6px);
    text-shadow: 0 1px 6px rgba(0,40,70,0.5); letter-spacing: 0.5px;
  }
  #mute-btn {
    top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%;
    z-index: 30;
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.45);
    backdrop-filter: blur(6px); color: #fff; font-size: 20px; cursor: pointer;
    pointer-events: auto; display: flex; align-items: center; justify-content: center;
    text-shadow: 0 1px 4px rgba(0,40,70,0.5);
  }
  #mute-btn:active { transform: scale(0.92); }
  #tilt-debug {
    bottom: 12px; right: 12px; font-size: 10px; color: #e8fbff;
    background: rgba(0,40,70,0.35); padding: 4px 8px; border-radius: 6px;
  }
  #overlay {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(10, 60, 90, 0.25); backdrop-filter: blur(10px);
    display: flex; justify-content: center; align-items: center;
    transition: opacity 0.3s; padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay:not(.hidden) .glass-card { animation: cardPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes cardPop {
    0% { transform: scale(0.6) translateY(24px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  #error-boundary {
    display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
    background: rgba(170, 20, 20, 0.92); color: #fff;
    font-family: monospace; font-size: 11px; padding: 8px 10px;
    white-space: pre-wrap; word-break: break-word;
  }
  .glass-card {
    background: linear-gradient(160deg, rgba(255,255,255,0.75), rgba(210,245,255,0.55));
    border: 1px solid rgba(255,255,255,0.8); border-radius: 26px;
    padding: 34px 30px; text-align: center; max-width: 330px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,60,100,0.25), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .glass-card h1 {
    margin: 0 0 6px; font-size: 30px; font-weight: 800; color: #0b3b5c;
    text-shadow: 0 1px 0 rgba(255,255,255,0.7); letter-spacing: 0.5px;
  }
  .glass-card p { margin: 0 0 8px; color: #155e85; font-size: 15px; line-height: 1.45; }
  #final-score {
    font-size: 44px; font-weight: 900; color: #0a7ab5; margin: 6px 0 10px;
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
  }
  #final-score.hidden { display: none; }
  .btn {
    display: block; width: 100%; margin-top: 10px; padding: 14px 20px;
    border: none; border-radius: 100px; cursor: pointer;
    font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 0.3px;
    background: linear-gradient(180deg, #37c6f2, #0e93d1);
    box-shadow: 0 6px 18px rgba(14,147,209,0.45), inset 0 1px 0 rgba(255,255,255,0.55);
    transition: transform 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-secondary {
    background: rgba(255,255,255,0.35); color: #0b5b84; font-size: 14px; font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.6);
  }
  #controls-hint { margin-top: 16px; font-size: 11px; color: #3d7f9e; opacity: 0.85; }
  #pet-tag {
    bottom: 12px; left: 12px; font-size: 11px; font-weight: 700; color: #eafcff;
    background: rgba(0,40,70,0.35); padding: 5px 12px; border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  <div id="score-display" class="ui-layer">0</div>
  <button id="mute-btn" class="ui-layer" title="Sound on/off">&#128266;</button>
  <div id="tilt-debug" class="ui-layer">Tilt: N/A</div>
  <div id="pet-tag" class="ui-layer">Inky the squid</div>
  <div id="overlay">
    <div class="glass-card">
      <h1 id="title">Glass Orb</h1>
      <p id="msg">Guide the orb skyward. Ride the vines, dodge the thorns. Inky the squid has your back.</p>
      <div id="final-score" class="hidden">0</div>
      <button id="start-btn" class="btn">Start Journey</button>
      <button id="tilt-btn" class="btn btn-secondary">Enable Tilt Controls</button>
      <p id="controls-hint">Move with mouse, touch, or tilt.<br>Tap the speaker icon anytime to mute.</p>
    </div>
  </div>
</div>
<div id="error-boundary"></div>
<script src="../shared/pet-hook.js"></script>
<script>
'use strict';
/* ============================================================
   Vine Climber: Glass Orb Edition - Zuckbot orb + live pet companion (shared pet hook)
   Self-contained. No external assets, no network calls.
   ============================================================ */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score-display');
const tiltDebugEl = document.getElementById('tilt-debug');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const tiltBtn = document.getElementById('tilt-btn');
const muteBtn = document.getElementById('mute-btn');
const finalScoreEl = document.getElementById('final-score');
const titleEl = document.getElementById('title');
const msgEl = document.getElementById('msg');

/* ---------------- Audio: layered Web Audio SFX ---------------- */
const AudioSys = {
  ctx: null, master: null, muted: false,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.5;
    this.master.connect(this.ctx.destination);
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    muteBtn.innerHTML = this.muted ? '&#128263;' : '&#128266;';
    return this.muted;
  },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
  env(g, t0, attack, peak, dur) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  },
  tone(freq, dur, type, peak, slideTo, delay) {
    if (!this.ctx || this.muted) return;
    type = type || 'sine'; peak = peak || 0.25; delay = delay || 0;
    const t0 = this.now() + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t0 + dur);
    this.env(g, t0, 0.008, peak, dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur, peak, filterFreq, type, delay, slideTo) {
    if (!this.ctx || this.muted) return;
    type = type || 'highpass'; delay = delay || 0;
    const t0 = this.now() + delay;
    const len = Math.max(1, Math.floor((dur + 0.05) * this.ctx.sampleRate));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(filterFreq, t0);
    if (slideTo) f.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 10), t0 + dur);
    const g = this.ctx.createGain();
    this.env(g, t0, 0.005, peak, dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  },
  /* Glass pling: bright attack, downward pitch snap, glassy partials. Pitch climbs with streak */
  bounce(streak) {
    const base = 880 + Math.min(streak, 14) * 26;
    this.tone(base, 0.16, 'sine', 0.24, base * 0.72);
    this.tone(base * 2.01, 0.12, 'sine', 0.10, base * 2.01 * 0.8);
    this.tone(base * 3.98, 0.08, 'triangle', 0.06);
    this.noise(0.02, 0.06, 8000, 'highpass');
  },
  /* Water drop: sine 300Hz -> 1200Hz sweep in 0.08s, 0.15s decay */
  drop() {
    if (!this.ctx || this.muted) return;
    const t0 = this.now();
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(300, t0);
    o.frequency.exponentialRampToValueAtTime(1200, t0 + 0.08);
    g.gain.setValueAtTime(0.16, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + 0.2);
  },
  milestone() {
    const notes = [659.25, 830.61, 987.77, 1318.5];
    for (let i = 0; i < notes.length; i++) this.tone(notes[i], 0.32, 'triangle', 0.14, null, i * 0.07);
    this.noise(0.15, 0.04, 8000, 'highpass', 0.1);
  },
  shatter() {
    this.noise(0.4, 0.38, 3200, 'highpass', 0, 700);
    for (let i = 0; i < 7; i++) this.tone(rand(1700, 4300), rand(0.08, 0.22), 'sine', 0.07, rand(800, 1500), i * 0.03);
    this.tone(200, 0.45, 'sine', 0.18, 55);
  },
  fall() {
    this.noise(0.55, 0.18, 1400, 'lowpass', 0, 180);
    this.tone(420, 0.55, 'sine', 0.10, 80);
  },
  click() { this.tone(720, 0.07, 'sine', 0.14, 980); },
  warn() { this.tone(340, 0.1, 'square', 0.045, 290); },
  splash() { this.noise(0.2, 0.12, 2500, 'bandpass', 0, 900); }
};
muteBtn.addEventListener('click', (e) => { e.stopPropagation(); AudioSys.init(); AudioSys.toggleMute(); AudioSys.click(); });

/* ---------------- Constants & state ---------------- */
const GRAVITY = 0.45;
const JUMP_STRENGTH = -12.5;
const SPRING_STRENGTH = -22.0;
const MAX_FALL_SPEED = 15.0;
const H_ACCEL = 0.8;
const H_FRICTION = 0.88;
const H_MAX_SPEED = 8.0;
const REACHABLE_GAP = 160; // safety margin under max jump height v^2/2g = 173.6
const CANVAS_WIDTH = 400;
const CANVAS_HEIGHT = 650;
const PLATFORM_COUNT = 8;
const ORB_RADIUS = 16;

let gameState = 'START';
let score = 0;
let cameraY = 0;
let mouseX = CANVAS_WIDTH / 2;
let lastInputWasTouch = false;
let touchTargetX = CANVAS_WIDTH / 2;
let touchSmoothX = CANVAS_WIDTH / 2;
let tiltX = 0;
let useTilt = false;
let sensorActive = false;
let gameTime = 0;
let bounceStreak = 0;
let nextMilestone = 500;
let topY = 0;
let hitStopUntil = 0;
let shakeT = 0;
const SHAKE_AMP = 9;
function hitStop(ms) { hitStopUntil = Math.max(hitStopUntil, performance.now() + ms); }
function addShake(v) { shakeT = Math.min(1, shakeT + v); }

/* ---------------- Pre-rendered sprites (perf) ---------------- */
function makeSprite(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  return c;
}
/* Soft cyan glow used behind the orb */
const glowSprite = makeSprite(128, (g, s) => {
  const gr = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  gr.addColorStop(0, 'rgba(140,225,255,0.55)');
  gr.addColorStop(0.5, 'rgba(120,210,250,0.22)');
  gr.addColorStop(1, 'rgba(120,210,250,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
/* Glass bubble used for ambient bubbles and bounce bursts */
const bubbleSprite = makeSprite(64, (g, s) => {
  const c = s / 2;
  const gr = g.createRadialGradient(c - 8, c - 10, 2, c, c, c - 2);
  gr.addColorStop(0, 'rgba(255,255,255,0.85)');
  gr.addColorStop(0.4, 'rgba(200,240,255,0.28)');
  gr.addColorStop(0.85, 'rgba(160,220,250,0.35)');
  gr.addColorStop(1, 'rgba(255,255,255,0.55)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(c, c, c - 3, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 2; g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.95)';
  g.beginPath(); g.ellipse(c - 12, c - 14, 7, 4.5, -0.6, 0, TAU); g.fill();
  g.beginPath(); g.arc(c + 8, c - 18, 2.5, 0, TAU); g.fill();
});
/* Cached background gradient (rebuilt on resize) */
let bgGrad = null;
function buildBg() {
  bgGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
  bgGrad.addColorStop(0, '#bfefff');
  bgGrad.addColorStop(0.35, '#8fdcf5');
  bgGrad.addColorStop(0.7, '#5cbfe8');
  bgGrad.addColorStop(1, '#3aa8d8');
}

/* ---------------- Input: mouse / touch / tilt ---------------- */
function updateTouch(e) {
  if (useTilt && sensorActive) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_WIDTH / rect.width;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const x = (clientX - rect.left) * scaleX;
  if (e.touches) touchTargetX = clamp(x, 0, CANVAS_WIDTH);
  else mouseX = x;
}
window.addEventListener('mousemove', (e) => { lastInputWasTouch = false; updateTouch(e); });
window.addEventListener('touchstart', (e) => {
  if (gameState === 'PLAYING') e.preventDefault();
  lastInputWasTouch = true;
  updateTouch(e);
}, { passive: false });
window.addEventListener('touchmove', (e) => {
  if (gameState === 'PLAYING') e.preventDefault();
  lastInputWasTouch = true;
  updateTouch(e);
}, { passive: false });

async function requestTilt() {
  tiltBtn.innerText = 'Requesting...';
  if (typeof DeviceOrientationEvent !== 'undefined') {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission === 'granted') startTiltTracking();
        else tiltBtn.innerText = 'Permission Denied';
      } catch (err) { tiltBtn.innerText = 'Error requesting tilt'; }
    } else startTiltTracking();
  } else tiltBtn.innerText = 'Tilt Not Supported';
}
function startTiltTracking() {
  useTilt = true;
  window.addEventListener('deviceorientation', (event) => {
    if (event.gamma !== null) {
      tiltX = event.gamma; sensorActive = true;
      tiltBtn.innerText = 'Tilt Active';
    }
  });
  setTimeout(() => { if (!sensorActive) tiltBtn.innerText = 'No Sensor Data'; }, 1000);
}
tiltBtn.addEventListener('click', requestTilt);

/* In-game error boundary: surfaces runtime errors on screen for testing */
window.addEventListener('error', (e) => {
  const el = document.getElementById('error-boundary');
  el.style.display = 'block';
  el.textContent = 'Runtime error: ' + e.message + ' @ line ' + e.lineno;
});
window.addEventListener('unhandledrejection', (e) => {
  const el = document.getElementById('error-boundary');
  el.style.display = 'block';
  el.textContent = 'Unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
});

/* ---------------- Particles ---------------- */
const particles = [];
const ambientBubbles = [];
function initAmbient() {
  ambientBubbles.length = 0;
  for (let i = 0; i < 14; i++) {
    ambientBubbles.push({
      x: rand(0, CANVAS_WIDTH), phase: rand(0, CANVAS_HEIGHT + 48),
      r: rand(5, 16), rise: 0, speed: rand(0.25, 0.8),
      wob: rand(0, TAU), wobSpeed: rand(0.01, 0.03)
    });
  }
}
function spawnBurst(x, y, n, spread, up) {
  for (let i = 0; i < n; i++) {
    if (particles.length > 160) return;
    particles.push({
      type: 'bubble', x: x, y: y,
      vx: rand(-spread, spread), vy: rand(-up, -up * 0.3),
      life: 0, maxLife: rand(28, 55), size: rand(4, 11)
    });
  }
}
function spawnRing(x, y) {
  if (particles.length > 160) return;
  particles.push({ type: 'ring', x: x, y: y, life: 0, maxLife: 20, size: 10 });
}
function spawnInk(x, y) {
  for (let i = 0; i < 10; i++) {
    if (particles.length > 160) return;
    particles.push({
      type: 'ink', x: x + rand(-6, 6), y: y + rand(-4, 6),
      vx: rand(-1.2, 1.2), vy: rand(-0.6, 1.4),
      life: 0, maxLife: rand(30, 60), size: rand(5, 10)
    });
  }
}
function spawnSparkle(x, y) {
  for (let i = 0; i < 6; i++) {
    if (particles.length > 160) return;
    particles.push({
      type: 'spark', x: x + rand(-10, 10), y: y + rand(-10, 10),
      vx: rand(-0.8, 0.8), vy: rand(-1.4, -0.2),
      life: 0, maxLife: rand(20, 40), size: rand(2, 4)
    });
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life++;
    if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
    if (p.type === 'ring') { p.size += 2.4; continue; }
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.985; p.vy *= 0.985;
    if (p.type === 'bubble') p.vy -= 0.02;
  }
  for (const b of ambientBubbles) {
    b.wob += b.wobSpeed;
    b.rise += b.speed;
  }
}
function drawParticles() {
  ctx.save();
  ctx.translate(0, -cameraY);
  for (const p of particles) {
    const t = 1 - p.life / p.maxLife;
    if (p.type === 'bubble') {
      ctx.globalAlpha = t * 0.9;
      const s = p.size * 2;
      ctx.drawImage(bubbleSprite, p.x - s/2, p.y - s/2, s, s);
    } else if (p.type === 'ring') {
      ctx.globalAlpha = t * 0.8;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.stroke();
      ctx.globalAlpha = t * 0.35;
      ctx.strokeStyle = '#bfefff'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.8, 0, TAU); ctx.stroke();
    } else if (p.type === 'ink') {
      ctx.globalAlpha = t * 0.55;
      ctx.fillStyle = '#123a5e';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.6 + 0.4 * (p.life / p.maxLife)), 0, TAU); ctx.fill();
    } else if (p.type === 'spark') {
      ctx.globalAlpha = t;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(p.x - p.size/2, p.y - p.size/4, p.size, p.size/2);
      ctx.fillRect(p.x - p.size/4, p.y - p.size/2, p.size/2, p.size);
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  /* Ambient bubbles live in screen space, drifting up past the camera */
  const span = CANVAS_HEIGHT + 48;
  for (const b of ambientBubbles) {
    let sy = (b.phase - cameraY * 0.9 - b.rise) % span;
    if (sy < 0) sy += span;
    sy -= 24;
    const sx = b.x + Math.sin(b.wob) * 8;
    ctx.globalAlpha = 0.45;
    const s = b.r * 2;
    ctx.drawImage(bubbleSprite, sx - s/2, sy - s/2, s, s);
  }
  ctx.globalAlpha = 1;
}

/* ---------------- Zuckbot orb (player) ---------------- */
class Orb {
  constructor() { this.reset(); }
  reset() {
    this.x = CANVAS_WIDTH / 2;
    this.y = CANVAS_HEIGHT - 100;
    this.vx = 0; this.vy = 0;
    this.isBroken = false;
    this.sx = 1; this.sy = 1;          // squash and stretch
    this.eyeH = 1;                      // blink state
    this.blinkT = rand(2, 4.5);
    this.blinkPhase = 0;
    this.spin = 0;
  }
  bounce() {
    this.vy = JUMP_STRENGTH;
    this.sx = 1.28; this.sy = 0.72;    // squash on impact
    bounceStreak++;
  }
  update() {
    if (this.isBroken) return;
    if (useTilt && sensorActive) {
      this.vx += tiltX * 0.4;
      this.vx *= 0.92;
    } else if (lastInputWasTouch) {
      /* Finger: two-stage smoothed tracking kills touch-sensor jitter */
      touchSmoothX += (touchTargetX - touchSmoothX) * 0.45;
      const delta = (touchSmoothX - this.x) * 0.4;
      this.x += delta;
      this.vx += (delta - this.vx) * 0.5;
    } else {
      const dx = mouseX - this.x;
      if (Math.abs(dx) > 4) this.vx += Math.sign(dx) * H_ACCEL;
      else this.vx *= H_FRICTION;
      this.vx = clamp(this.vx, -H_MAX_SPEED, H_MAX_SPEED);
    }
    this.x += this.vx;
    this.vy = Math.min(this.vy + GRAVITY, MAX_FALL_SPEED);
    this.y += this.vy;
    if (this.x < -ORB_RADIUS) this.x = CANVAS_WIDTH + ORB_RADIUS;
    if (this.x > CANVAS_WIDTH + ORB_RADIUS) this.x = -ORB_RADIUS;
    if (this.y < cameraY + 250) cameraY = this.y - 250;
    /* Relax squash, run blink timer */
    this.sx = lerp(this.sx, 1, 0.22);
    this.sy = lerp(this.sy, 1, 0.22);
    this.blinkT -= 1/60;
    if (this.blinkT <= 0) { this.blinkPhase = 0.14; this.blinkT = rand(2.2, 5); }
    if (this.blinkPhase > 0) {
      this.blinkPhase -= 1/60;
      this.eyeH = 0.12;
    } else this.eyeH = lerp(this.eyeH, 1, 0.4);
    this.spin += this.vx * 0.002;
  }
  draw() {
    const x = this.x, y = this.y - cameraY, R = ORB_RADIUS;
    ctx.save();
    /* Outer cyan glow */
    ctx.globalAlpha = 0.85;
    ctx.drawImage(glowSprite, x - 34, y - 34, 68, 68);
    ctx.globalAlpha = 1;
    ctx.translate(x, y);
    ctx.scale(this.sx, this.sy);
    if (this.isBroken) {
      /* Shatter lines */
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * TAU + this.spin;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 4, Math.sin(a) * 4);
        ctx.lineTo(Math.cos(a) * rand(14, 26), Math.sin(a) * rand(14, 26));
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
    /* Glass body */
    const bg = ctx.createRadialGradient(-5, -6, 2, 0, 0, R);
    bg.addColorStop(0, 'rgba(255,255,255,0.95)');
    bg.addColorStop(0.25, 'rgba(190,230,255,0.55)');
    bg.addColorStop(0.7, 'rgba(110,180,245,0.35)');
    bg.addColorStop(1, 'rgba(70,140,230,0.55)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    /* Dark inner core */
    ctx.fillStyle = '#0b1233';
    ctx.beginPath(); ctx.ellipse(0, 2, R * 0.52, R * 0.44, 0, 0, TAU); ctx.fill();
    /* Amber glowing eyes, look toward motion, blink */
    const look = clamp(this.vx * 0.035, -3, 3);
    for (const s of [-1, 1]) {
      const ex = s * R * 0.24 + look, ey = 2;
      const gl = ctx.createRadialGradient(ex, ey, 0, ex, ey, R * 0.32);
      gl.addColorStop(0, 'rgba(255,210,110,0.95)');
      gl.addColorStop(1, 'rgba(255,180,80,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(ex, ey, R * 0.32, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd97a';
      ctx.beginPath(); ctx.ellipse(ex, ey, R * 0.17, R * 0.17 * this.eyeH, 0, 0, TAU); ctx.fill();
      if (this.eyeH > 0.5) {
        ctx.fillStyle = '#fff6dd';
        ctx.beginPath(); ctx.arc(ex - 1, ey - 1.5, R * 0.06, 0, TAU); ctx.fill();
      }
    }
    /* Sparkle plus under the eyes */
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    const spx = -R * 0.05, spy = R * 0.42, sl = 3.5;
    ctx.beginPath();
    ctx.moveTo(spx - sl, spy); ctx.lineTo(spx + sl, spy);
    ctx.moveTo(spx, spy - sl); ctx.lineTo(spx, spy + sl);
    ctx.stroke();
    /* Top speculars */
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.ellipse(-R * 0.38, -R * 0.42, R * 0.20, R * 0.12, -0.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-R * 0.12, -R * 0.58, R * 0.06, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* Height climbed in px, measured from the orb's starting line */
const heightAt = (y) => Math.max(0, (CANVAS_HEIGHT - 100) - y);
/* Vertical gap to the next platform, per height bracket. Always under REACHABLE_GAP. */
function bracketGap(h) {
  if (h < 1000) return rand(60, 90);
  if (h < 2500) return rand(70, 110);
  if (h < 5000) return rand(80, 130);
  return rand(90, 155);
}

/* ---------------- Vine platform with dew ---------------- */
class Platform {
  constructor(y, isFirst) {
    this.height = 12;
    this.dew = [];
    this.spawn(y, heightAt(y), isFirst);
    if (isFirst) this.x = (CANVAS_WIDTH - this.width) / 2;
    this.seedDew();
  }
  seedDew() {
    this.dew = [];
    for (let i = 0; i < 3; i++) this.dew.push({ dx: rand(6, Math.max(8, this.width - 6)), r: rand(1.5, 3) });
  }
  /* Chunk-based spawn by height bracket:
     0-1000 wide static clusters, 1000+ pacing, 2500+ decaying/oscillating,
     5000+ moving + decaying + hazards. */
  spawn(y, h, isFirst) {
    this.gone = false;
    this.phase = rand(0, TAU);
    if (isFirst || h < 1000) {
      this.width = isFirst ? 150 : rand(110, 150);
      this.type = 'normal';
    } else if (h < 2500) {
      this.width = rand(70, 110);
      const r = Math.random();
      this.type = r < 0.55 ? 'normal' : (r < 0.85 ? 'moving' : 'spring');
    } else if (h < 5000) {
      this.width = rand(60, 95);
      const r = Math.random();
      this.type = r < 0.35 ? 'normal' : r < 0.60 ? 'moving' : r < 0.78 ? 'breaking' : r < 0.90 ? 'osc' : 'spring';
    } else {
      this.width = rand(55, 85);
      const r = Math.random();
      this.type = r < 0.28 ? 'normal' : r < 0.52 ? 'moving' : r < 0.70 ? 'breaking' : r < 0.84 ? 'osc' : 'spring';
    }
    this.x = rand(0, CANVAS_WIDTH - this.width);
    this.y = y;
    this.baseY = y;
    this.speed = rand(-1, 1);
    this.oscAmp = rand(18, 34);
    this.oscFreq = rand(1.2, 2.4);
  }
  shatter() {
    this.gone = true;
    spawnBurst(this.x + this.width / 2, this.y, 8, 2, 1.5);
  }
  update(t) {
    if (this.gone) return;
    if (this.type === 'moving') {
      this.x += this.speed;
      if (this.x < 0 || this.x + this.width > CANVAS_WIDTH) this.speed *= -1;
    } else if (this.type === 'osc') {
      this.y = this.baseY + Math.sin(t * this.oscFreq + this.phase) * this.oscAmp;
    }
  }
  draw() {
    const y = this.y - cameraY;
    if (y < -30 || y > CANVAS_HEIGHT + 30) return;
    if (this.gone) return;
    ctx.save();
    /* Spring coil marker */
    if (this.type === 'spring') {
      ctx.strokeStyle = '#ffe14d';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const cx = this.x + this.width / 2;
      for (let i = 0; i <= 6; i++) {
        const sx = cx + (i % 2 === 0 ? -7 : 7);
        const sy2 = y - 2 - i * 3;
        if (i === 0) ctx.moveTo(sx, sy2); else ctx.lineTo(sx, sy2);
      }
      ctx.stroke();
    }
    /* Vine body */
    ctx.strokeStyle = this.type === 'breaking' ? '#7fae8f' : '#0e6e3f';
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x, y + this.height/2);
    ctx.quadraticCurveTo(this.x + this.width/2, y - 5, this.x + this.width, y + this.height/2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(180,255,200,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(this.x + 3, y + this.height/2 - 2);
    ctx.quadraticCurveTo(this.x + this.width/2, y - 7, this.x + this.width - 3, y + this.height/2 - 2);
    ctx.stroke();
    /* Leaves */
    const leafCount = 3;
    for (let i = 0; i <= leafCount; i++) {
      const px = this.x + (this.width / leafCount) * i;
      ctx.fillStyle = i % 2 === 0 ? '#2bd96a' : '#12a150';
      ctx.beginPath();
      ctx.ellipse(px, y - 1, 8, 4, (i % 2 ? 0.5 : -0.5), 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath(); ctx.ellipse(px - 2, y - 2.5, 3, 1.4, -0.5, 0, TAU); ctx.fill();
    }
    /* Cracks on decaying vines */
    if (this.type === 'breaking') {
      ctx.strokeStyle = 'rgba(60,40,20,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(this.x + this.width * 0.3, y + 2); ctx.lineTo(this.x + this.width * 0.45, y - 3);
      ctx.moveTo(this.x + this.width * 0.7, y + 2); ctx.lineTo(this.x + this.width * 0.6, y - 3);
      ctx.stroke();
    }
    /* Dew drops */
    for (const d of this.dew) {
      ctx.fillStyle = 'rgba(220,245,255,0.9)';
      ctx.beginPath(); ctx.arc(this.x + d.dx, y - 4, d.r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.arc(this.x + d.dx - d.r * 0.3, y - 4 - d.r * 0.3, d.r * 0.35, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------------- Thorn enemy ---------------- */
class Enemy {
  constructor(y) {
    this.radius = 12;
    this.x = Math.random() > 0.5 ? -50 : CANVAS_WIDTH + 50;
    this.y = y;
    this.speed = (1.2 + Math.random() * 1.5) * (this.x < 0 ? 1 : -1);
    this.angle = 0;
  }
  update() { this.x += this.speed; this.angle += 0.05; }
  draw() {
    const y = this.y - cameraY;
    if (y < -40 || y > CANVAS_HEIGHT + 40) return;
    ctx.save();
    ctx.translate(this.x, y);
    ctx.rotate(this.angle);
    ctx.fillStyle = '#3d0a12';
    ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#5c1119'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath();
      ctx.moveTo(0, -this.radius);
      ctx.lineTo(0, -this.radius - 7);
      ctx.stroke();
    }
    ctx.fillStyle = '#ff5d5d';
    ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(-1, -1, 1.2, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ---------------- Live pet companion (shared pet hook) ----------------
   The companion is the player's actual pet, not a hardcoded character.
   Pet data comes from ?pet= JSON or localStorage via window.MusePet;
   on the live site the member's real pet is injected through the same hook. */
const LivePet = {
  pet: null, imgs: {}, ready: false,
  init() {
    try {
      if (window.MusePet) {
        this.pet = window.MusePet.get();
        this.ready = !!(this.pet);
        if (this.ready) {
          const tag = document.getElementById('pet-tag');
          if (tag) tag.textContent = this.pet.name;
          const msg = document.getElementById('msg');
          if (msg) msg.textContent = 'Guide the orb skyward. Ride the vines, dodge the thorns. ' + this.pet.name + ' has your back.';
        }
      }
    } catch (e) { this.ready = false; }
  },
  img(mood) {
    if (!this.ready) return null;
    if (!this.imgs[mood]) {
      try {
        const svg = window.MusePet.renderSVG(this.pet, mood);
        const im = new Image();
        im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        this.imgs[mood] = im;
      } catch (e) { return null; }
    }
    return this.imgs[mood];
  },
  petName() { return (this.ready && this.pet.name) || 'your pet'; }
};

/* ---------------- Companion (movement + moods; art from LivePet) ----------------
   Placement rotates through four anchor offsets around the orb,
   a few seconds at each, gliding between them. */
const PET_ANCHORS = [
  { dx: -38, dy: -34 }, { dx: 38, dy: -34 },
  { dx: -40, dy: 30 },  { dx: 40, dy: 30 }
];
class Squid {
  constructor() {
    this.x = CANVAS_WIDTH / 2 - 38; this.y = CANVAS_HEIGHT - 140;
    this.anchor = 0; this.timer = 0;
    this.happy = 0; this.scared = 0; this.inkCd = 0;
  }
  update(tx, ty, time, enemyNear) {
    this.timer += 1/60;
    if (this.timer > 3.4) { this.timer = 0; this.anchor = (this.anchor + 1) % PET_ANCHORS.length; }
    const a = PET_ANCHORS[this.anchor];
    this.x = lerp(this.x, tx + a.dx, 0.07);
    this.y = lerp(this.y, ty + a.dy, 0.07);
    this.happy = Math.max(0, this.happy - 1/60);
    this.scared = Math.max(0, this.scared - (1/60) * 0.6);
    this.inkCd = Math.max(0, this.inkCd - 1/60);
    if (enemyNear && this.inkCd <= 0) {
      this.scared = 1; this.inkCd = 2.5;
      spawnInk(this.x, this.y);
      AudioSys.warn();
    }
  }
  excite() { this.happy = 0.6; }
  draw(time) {
    const x = this.x, y = this.y - cameraY + Math.sin(time * 3.1) * 3;
    if (y < -40 || y > CANVAS_HEIGHT + 40) return;
    const mood = this.happy > 0.15 ? 'happy' : (this.scared > 0.15 ? 'sad' : 'idle');
    const pop = 1 + this.happy * 0.18;
    const img = LivePet.img(mood);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(pop, pop);
    if (this.scared > 0.15) ctx.translate(rand(-1.5, 1.5), rand(-1, 1));
    if (img && img.complete && img.naturalWidth > 0) {
      const s = 46;
      ctx.drawImage(img, -s / 2, -s / 2, s, s);
    }
    /* Happy sparkles */
    if (this.happy > 0.1) {
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      const s = 3 + Math.sin(time * 12) * 1;
      ctx.fillRect(-13 - s/2, -18 - s/4, s, s/2);
      ctx.fillRect(-13 - s/4, -18 - s/2, s/2, s);
      ctx.fillRect(11 - s/2, -21 - s/4, s, s/2);
      ctx.fillRect(11 - s/4, -21 - s/2, s/2, s);
    }
    ctx.restore();
  }
}

/* ---------------- Game state ---------------- */
const orb = new Orb();
const squid = new Squid();
let platforms = [];
let enemies = [];

function initGame() {
  platforms = [];
  enemies = [];
  particles.length = 0;
  cameraY = 0;
  score = 0;
  bounceStreak = 0;
  nextMilestone = 500;
  gameTime = 0;
  let y = CANVAS_HEIGHT;
  for (let i = 0; i < PLATFORM_COUNT; i++) {
    const p = new Platform(y, i === 0);
    platforms.push(p);
    topY = y;
    y -= bracketGap(heightAt(y));
  }
  initAmbient();
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = CANVAS_WIDTH * dpr;
  canvas.height = CANVAS_HEIGHT * dpr;
  canvas.style.width = CANVAS_WIDTH + 'px';
  canvas.style.height = CANVAS_HEIGHT + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildBg();
}

/* ---------------- Update ---------------- */
function update() {
  if (gameState !== 'PLAYING') return;
  gameTime += 1/60;
  shakeT = Math.max(0, shakeT - 1/30);
  orb.update();

  /* Bounce off vines: one-way pass-through, feet must have been above last frame */
  if (orb.vy > 0 && !orb.isBroken) {
    const prevFeet = orb.y - orb.vy + ORB_RADIUS;
    for (const p of platforms) {
      if (p.gone) continue;
      if (prevFeet <= p.y + 3 &&
          orb.y + ORB_RADIUS > p.y && orb.y + ORB_RADIUS < p.y + p.height + 15 &&
          orb.x + ORB_RADIUS > p.x && orb.x - ORB_RADIUS < p.x + p.width) {
        if (p.type === 'spring') {
          orb.vy = SPRING_STRENGTH;
          orb.sx = 0.72; orb.sy = 1.28;
          bounceStreak++;
          hitStop(30);
          addShake(0.25);
          AudioSys.bounce(bounceStreak);
          AudioSys.drop();
          spawnRing(orb.x, orb.y + ORB_RADIUS);
        } else {
          orb.bounce();
          AudioSys.bounce(bounceStreak);
          AudioSys.drop();
          if (p.type === 'breaking') p.shatter();
        }
        spawnBurst(orb.x, orb.y + ORB_RADIUS, 7, 2.2, 2.4);
        spawnRing(orb.x, orb.y + ORB_RADIUS);
        squid.excite();
        break;
      }
    }
  }

  /* Enemies */
  let enemyNear = false;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    en.update();
    const dx = orb.x - en.x, dy = orb.y - en.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 150) enemyNear = true;
    if (dist < ORB_RADIUS + en.radius - 5 && !orb.isBroken) {
      orb.isBroken = true;
      hitStop(50);
      addShake(1);
      AudioSys.shatter();
      spawnBurst(orb.x, orb.y, 14, 3.5, 3);
      setTimeout(endGame, 1000);
    }
    if (en.x < -100 || en.x > CANVAS_WIDTH + 100 || en.y > cameraY + CANVAS_HEIGHT + 100) {
      enemies.splice(i, 1);
    }
  }
  const hNow = heightAt(cameraY);
  if (Math.random() < 0.004 + (hNow > 2500 ? 0.004 : 0) + (hNow > 5000 ? 0.004 : 0) + (score / 100000)) {
    enemies.push(new Enemy(cameraY - 50));
  }

  /* Squid follows the orb */
  squid.update(orb.x, orb.y, gameTime, enemyNear);

  /* Recycle platforms above the highest one, enforcing the reachable gap */
  for (const p of platforms) {
    p.update(gameTime);
    if (p.y > cameraY + CANVAS_HEIGHT) {
      topY -= bracketGap(heightAt(topY));
      p.spawn(topY, heightAt(topY), false);
      p.seedDew();
    }
  }

  updateParticles();

  /* Score + milestones */
  score = Math.max(score, Math.floor(-orb.y + (CANVAS_HEIGHT - 100)));
  scoreEl.innerText = score;
  if (score >= nextMilestone) {
    AudioSys.milestone();
    spawnSparkle(orb.x, orb.y - 30);
    nextMilestone += 500;
  }

  /* Fell out of the world */
  if (orb.y > cameraY + CANVAS_HEIGHT + 100 && !orb.isBroken) {
    AudioSys.fall();
    endGame();
  }
  if (useTilt) tiltDebugEl.innerText = 'Tilt: ' + tiltX.toFixed(1) + ' ' + (sensorActive ? 'on' : '?');
}

/* ---------------- Draw ---------------- */
function drawBackground() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  /* Sun glow, upper right */
  const sun = ctx.createRadialGradient(330, 70, 0, 330, 70, 190);
  sun.addColorStop(0, 'rgba(255,255,240,0.85)');
  sun.addColorStop(0.35, 'rgba(255,250,220,0.35)');
  sun.addColorStop(1, 'rgba(255,250,220,0)');
  ctx.fillStyle = sun;
  ctx.fillRect(140, 0, 260, 260);
  /* Soft light rays */
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = '#ffffff';
  ctx.translate(330, 70);
  ctx.rotate(-0.5);
  for (let i = 0; i < 3; i++) {
    ctx.rotate(0.22);
    ctx.fillRect(0, -14, 420, 28);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  /* Distant drifting bubble columns */
  ctx.save();
  ctx.globalAlpha = 0.22;
  const off = (cameraY * 0.4) % 220;
  for (let i = 0; i < 6; i++) {
    const bx = 40 + i * 66;
    let by = ((i * 173 + 400 - off) % 760) - 60;
    const s = 26 + (i % 3) * 14;
    ctx.drawImage(bubbleSprite, bx - s/2, by - s/2, s, s);
  }
  ctx.restore();
  /* Faint background vine */
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = '#0a4d2c';
  ctx.lineWidth = 26;
  ctx.beginPath();
  const vy = -(cameraY * 0.6 % 900);
  ctx.moveTo(50, vy);
  ctx.bezierCurveTo(150, vy + 250, -50, vy + 500, 100, vy + 750);
  ctx.stroke();
  ctx.restore();
}

/* Config integrity check: fail loudly on bad tuning values */
function verifyConfig() {
  const cfg = { GRAVITY, JUMP_STRENGTH, SPRING_STRENGTH, MAX_FALL_SPEED, H_ACCEL, H_FRICTION, H_MAX_SPEED, REACHABLE_GAP };
  for (const k in cfg) {
    if (typeof cfg[k] !== 'number' || !isFinite(cfg[k])) throw new Error('Config integrity fault: ' + k);
  }
  const maxJump = (JUMP_STRENGTH * JUMP_STRENGTH) / (2 * GRAVITY);
  if (REACHABLE_GAP >= maxJump) throw new Error('Reachable gap exceeds max jump height');
}

function draw() {
  ctx.save();
  if (shakeT > 0) {
    const s = SHAKE_AMP * shakeT * shakeT;
    ctx.translate(s * Math.sin(gameTime * 60), s * Math.cos(gameTime * 65));
  }
  drawBackground();
  for (const p of platforms) p.draw();
  for (const en of enemies) en.draw();
  squid.draw(gameTime);
  orb.draw();
  drawParticles();
  ctx.restore();
}

/* Fixed-timestep physics accumulator: 60Hz logic, render decoupled */
let lastT = 0, acc = 0;
const STEP = 1000 / 60;
function gameLoop(ts) {
  if (!lastT) lastT = ts;
  let dt = ts - lastT;
  lastT = ts;
  if (!isFinite(dt) || dt < 0) { dt = 0; acc = 0; }
  if (dt > 250) dt = 250;
  if (performance.now() < hitStopUntil) {
    acc = 0; /* hit-stop: freeze the sim, keep rendering */
  } else {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
    if (n === 5) acc = 0; /* spiral-of-death guard */
  }
  draw();
  requestAnimationFrame(gameLoop);
}

/* ---------------- Flow ---------------- */
function startGame() {
  AudioSys.init();
  AudioSys.resume();
  AudioSys.click();
  orb.reset();
  initGame();
  gameState = 'PLAYING';
  overlay.classList.add('hidden');
  finalScoreEl.classList.add('hidden');
  scoreEl.innerText = '0';
}

function endGame() {
  if (gameState !== 'PLAYING') return;
  gameState = 'GAMEOVER';
  overlay.classList.remove('hidden');
  titleEl.innerText = orb.isBroken ? 'Shattered' : 'Fallen';
  msgEl.innerText = orb.isBroken
    ? 'The orb burst into a thousand bubbles. ' + LivePet.petName() + ' believes in you.'
    : 'You slipped past the last vine. Shake it off and climb again.';
  finalScoreEl.innerText = score;
  finalScoreEl.classList.remove('hidden');
  startBtn.innerText = 'Re-emerge';
}

startBtn.addEventListener('click', startGame);
window.addEventListener('resize', resize);
resize();
initGame();
verifyConfig();
LivePet.init();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
