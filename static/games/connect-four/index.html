<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Connect Four</title>
<style>
  :root{
    --ink:#eafcff;
    --cyan:#38e1ff;
    --cyan-deep:#0e9dbd;
    --amber:#ffc94d;
    --amber-deep:#d98a12;
    --panel:rgba(10,42,66,.55);
    --panel-edge:rgba(255,255,255,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:rgba(56,225,255,.25);}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 20% -10%, #0e5d7d 0%, transparent 60%),
      radial-gradient(1000px 800px at 90% 110%, #0a4a63 0%, transparent 55%),
      linear-gradient(160deg,#06283b 0%, #073a52 45%, #0a556e 100%);
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
  header{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
    background:var(--panel);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);

  header h1{

    background:linear-gradient(180deg,#ffffff 20%,#a5f3fc 55%,#38e1ff 100%);

    white-space:nowrap;
  }
  #scores{display:flex;gap:8px;margin-left:auto;align-items:center;}
  .pill{
    padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:1px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset;
    white-space:nowrap;
  }
  .pill b{font-size:15px;}
  .pill.you b{color:var(--cyan);}
  .pill.ai b{color:var(--amber);}
  .pill.draw b{color:#c9e8f2;}
  button{
    font-family:inherit;font-weight:800;letter-spacing:1px;font-size:13px;
    color:#04283a;background:linear-gradient(180deg,#d9fbff 0%,#8fe9ff 45%,#38c8ee 100%);
    border:1px solid rgba(255,255,255,.6);border-radius:12px;
    padding:9px 14px;cursor:pointer;min-height:44px;
    box-shadow:0 2px 0 rgba(255,255,255,.5) inset, 0 -3px 6px rgba(4,40,58,.25) inset, 0 4px 12px rgba(0,0,0,.3);
  }
  button:active{transform:translateY(1px) scale(.98);}
  button.ghost{
    background:rgba(255,255,255,.1);color:var(--ink);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset;
  }
  #stage{position:relative;flex:1;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #errbox{
    display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:99;
    background:rgba(120,10,10,.92);color:#fff;font:12px/1.4 monospace;
    padding:8px 10px;border-radius:8px;white-space:pre-wrap;max-height:40%;overflow:auto;
  }
  #hint{
    position:absolute;left:0;right:0;bottom:8px;text-align:center;z-index:4;
    font-size:12px;letter-spacing:2px;color:rgba(234,252,255,.55);pointer-events:none;
  }
  @media (max-width:640px){
    header h1{font-size:15px;letter-spacing:2px;}
    .pill{padding:4px 8px;font-size:11px;}
    button{padding:8px 10px;font-size:12px;}
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>CONNECT FOUR</h1>
    <div id="scores">
      <span class="pill you">YOU <b id="sYou">0</b></span>
      <span class="pill ai">AI <b id="sAi">0</b></span>
      <span class="pill draw">DRAW <b id="sDraw">0</b></span>
    </div>
    <button id="btnNew" class="ghost" title="Start a new round (R)">NEW ROUND</button>
    <button id="btnMute" class="ghost" title="Toggle sound">SOUND ON</button>
  </header>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hint">TAP A COLUMN TO DROP &middot; KEYS 1-7 &middot; R FOR NEW ROUND</div>
  </div>
</div>
<div id="errbox"></div>

<script>
'use strict';
/* ============================================================
   CONNECT FOUR - human (cyan) vs AI (amber)
   Sections: Config, Pure logic (headless-testable), Audio,
   Sprites, Game state, Input, Render, Main loop.
   ============================================================ */

/* ---------- Config ---------- */
const CFG = {
  COLS: 7,
  ROWS: 6,
  HUMAN: 1,
  AI: 2,
  SEARCH_DEPTH: 4,
  WIN_SCORE: 1000000,
  DROP_MS: 620,
  HITSTOP_MS: 60,
  FIXED_DT: 1/60,
};
(function configCheck(){
  const bad = [];
  if(!(CFG.COLS>0)) bad.push('COLS');
  if(!(CFG.ROWS>0)) bad.push('ROWS');
  if(!(CFG.SEARCH_DEPTH>=1 && CFG.SEARCH_DEPTH<=8)) bad.push('SEARCH_DEPTH');
  if(!(CFG.DROP_MS>0)) bad.push('DROP_MS');
  if(bad.length) throw new Error('Bad config keys: '+bad.join(','));
})();

/* ---------- Pure game logic (no DOM) ---------- */
function newBoard(){
  const b = [];
  for(let r=0;r<CFG.ROWS;r++){ b.push(new Array(CFG.COLS).fill(0)); }
  return b;
}
// Row 0 is the top. Returns the landing row for a drop, or -1 if full.
function dropRow(board, col){
  for(let r=CFG.ROWS-1;r>=0;r--){ if(board[r][col]===0) return r; }
  return -1;
}
function applyMove(board, col, player){
  const r = dropRow(board, col);
  if(r>=0) board[r][col] = player;
  return r;
}
function legalMoves(board){
  const out = [];
  for(let c=0;c<CFG.COLS;c++){ if(board[0][c]===0) out.push(c); }
  return out;
}
function isFull(board){
  for(let c=0;c<CFG.COLS;c++){ if(board[0][c]===0) return false; }
  return true;
}
// Returns {player, cells:[[r,c]x4]} for a win, else null.
function checkWin(board){
  const R=CFG.ROWS, C=CFG.COLS;
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<R;r++){
    for(let c=0;c<C;c++){
      const p = board[r][c];
      if(p===0) continue;
      for(let d=0;d<4;d++){
        const dr=dirs[d][0], dc=dirs[d][1];
        const cells=[[r,c]];
        let ok=true;
        for(let k=1;k<4;k++){
          const nr=r+dr*k, nc=c+dc*k;
          if(nr<0||nr>=R||nc<0||nc>=C||board[nr][nc]!==p){ ok=false; break; }
          cells.push([nr,nc]);
        }
        if(ok) return {player:p, cells:cells};
      }
    }
  }
  return null;
}

/* ---------- AI: minimax + alpha-beta ---------- */
const ORDER = [3,2,4,1,5,0,6]; // center-out move ordering
function evalWindow(w, ai){
  const opp = ai===CFG.AI ? CFG.HUMAN : CFG.AI;
  let a=0, o=0, e=0;
  for(let i=0;i<4;i++){
    if(w[i]===ai) a++;
    else if(w[i]===opp) o++;
    else e++;
  }
  if(a===4) return 100000;
  if(o===4) return -100000;
  if(a===3 && e===1) return 14;
  if(a===2 && e===2) return 4;
  if(o===3 && e===1) return -18;
  if(o===2 && e===2) return -3;
  return 0;
}
function scorePosition(board, ai){
  let s=0;
  // center column preference
  for(let r=0;r<CFG.ROWS;r++){ if(board[r][3]===ai) s+=7; }
  // horizontal windows
  for(let r=0;r<CFG.ROWS;r++)
    for(let c=0;c<=CFG.COLS-4;c++)
      s+=evalWindow([board[r][c],board[r][c+1],board[r][c+2],board[r][c+3]], ai);
  // vertical windows
  for(let c=0;c<CFG.COLS;c++)
    for(let r=0;r<=CFG.ROWS-4;r++)
      s+=evalWindow([board[r][c],board[r+1][c],board[r+2][c],board[r+3][c]], ai);
  // diagonal down-right
  for(let r=0;r<=CFG.ROWS-4;r++)
    for(let c=0;c<=CFG.COLS-4;c++)
      s+=evalWindow([board[r][c],board[r+1][c+1],board[r+2][c+2],board[r+3][c+3]], ai);
  // diagonal up-right
  for(let r=3;r<CFG.ROWS;r++)
    for(let c=0;c<=CFG.COLS-4;c++)
      s+=evalWindow([board[r][c],board[r-1][c+1],board[r-2][c+2],board[r-3][c+3]], ai);
  return s;
}
function minimax(board, depth, alpha, beta, maximizing, ai){
  const opp = ai===CFG.AI ? CFG.HUMAN : CFG.AI;
  const win = checkWin(board);
  if(win){
    if(win.player===ai) return CFG.WIN_SCORE + depth*100; // prefer faster wins
    return -CFG.WIN_SCORE - depth*100;
  }
  if(depth===0 || isFull(board)) return scorePosition(board, ai);
  if(maximizing){
    let best=-Infinity;
    for(let i=0;i<ORDER.length;i++){
      const c=ORDER[i];
      const r=dropRow(board,c);
      if(r<0) continue;
      board[r][c]=ai;
      const v=minimax(board, depth-1, alpha, beta, false, ai);
      board[r][c]=0;
      if(v>best) best=v;
      if(best>alpha) alpha=best;
      if(beta<=alpha) break;
    }
    return best;
  }
  let best=Infinity;
  for(let i=0;i<ORDER.length;i++){
    const c=ORDER[i];
    const r=dropRow(board,c);
    if(r<0) continue;
    board[r][c]=opp;
    const v=minimax(board, depth-1, alpha, beta, true, ai);
    board[r][c]=0;
    if(v<best) best=v;
    if(best<beta) beta=best;
    if(beta<=alpha) break;
  }
  return best;
}
// Immediate winning column for player, or -1.
function immediateWin(board, player){
  for(let c=0;c<CFG.COLS;c++){
    const r=dropRow(board,c);
    if(r<0) continue;
    board[r][c]=player;
    const w=checkWin(board);
    board[r][c]=0;
    if(w && w.player===player) return c;
  }
  return -1;
}
function bestMove(board, ai){
  ai = ai || CFG.AI;
  const opp = ai===CFG.AI ? CFG.HUMAN : CFG.AI;
  // 1. take an immediate win
  let m = immediateWin(board, ai);
  if(m>=0) return m;
  // 2. block the opponent's immediate win
  m = immediateWin(board, opp);
  if(m>=0) return m;
  // 3. search
  let bestVal=-Infinity, bestCol=3;
  for(let i=0;i<ORDER.length;i++){
    const c=ORDER[i];
    const r=dropRow(board,c);
    if(r<0) continue;
    board[r][c]=ai;
    const v=minimax(board, CFG.SEARCH_DEPTH-1, -Infinity, Infinity, false, ai);
    board[r][c]=0;
    if(v>bestVal){ bestVal=v; bestCol=c; }
  }
  return bestCol;
}

/* ============================================================
   Browser UI below. Skipped entirely in headless tests.
   ============================================================ */
if(typeof document !== 'undefined'){
(function(){
'use strict';

/* ---------- Error boundary ---------- */
const errbox = document.getElementById('errbox');
window.addEventListener('error', function(e){
  errbox.style.display='block';
  errbox.textContent += 'ERR: '+(e.message||e.error)+'\n';
});
window.addEventListener('unhandledrejection', function(e){
  errbox.style.display='block';
  errbox.textContent += 'REJECT: '+(e.reason&&e.reason.message||e.reason)+'\n';
});

/* ---------- Audio: one master gain, mute toggle ---------- */
const AudioX = {
  ctx:null, master:null, muted:false,
  unlock(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      this.master.connect(this.ctx.destination);
    }catch(e){ /* audio unavailable, game still works */ }
  },
  toggleMute(){
    this.muted = !this.muted;
    if(this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    return this.muted;
  },
  tone(f0, f1, dur, type, vol, delay){
    if(!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + (delay||0);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(Math.max(f0,1), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.4, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.05);
  },
  // glass chime: fundamental + inharmonic partials
  chime(base, vol){
    const self=this;
    [[1,0],[2.01,0.35],[2.98,0.18]].forEach(function(p, i){
      self.tone(base*p[0], base*p[0]*0.995, 0.5, 'sine', (vol||0.35)*(1-i*0.25), i*0.015);
    });
  },
  click(){ this.tone(300, 1200, 0.08, 'sine', 0.25); },          // droplet UI
  land(){ this.tone(520, 170, 0.12, 'sine', 0.4); },             // disc lands
  win(){ this.chime(880, 0.4); this.chime(1174, 0.25); },        // glass chime
  lose(){ this.tone(420, 130, 0.5, 'triangle', 0.35); this.tone(300, 110, 0.6, 'sine', 0.25, 0.12); },
  drawS(){ this.tone(440, 440, 0.18, 'sine', 0.3); this.tone(554, 554, 0.22, 'sine', 0.25, 0.16); },
};

/* ---------- Canvas setup (DPR-correct) ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
let DPR=1, VW=0, VH=0;
let boardX=0, boardY=0, cell=64, discR=26;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  VW = stage.clientWidth; VH = stage.clientHeight;
  canvas.width = Math.round(VW*DPR); canvas.height = Math.round(VH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const pad = 16;
  cell = Math.min((VW-pad*2)/CFG.COLS, (VH-pad*2-70)/(CFG.ROWS+0.9));
  cell = Math.max(cell, 34);
  discR = cell*0.40;
  const bw = cell*CFG.COLS, bh = cell*CFG.ROWS;
  boardX = (VW-bw)/2;
  boardY = 58 + (VH-58-bh)/2;
  bakeSprites();
}
window.addEventListener('resize', resize);

/* ---------- Pre-baked orb sprites ---------- */
const sprites = {1:null, 2:null, ghost:null};
function bakeOrb(colorA, colorB, rim){
  const s = Math.ceil(discR*2.6);
  const c = document.createElement('canvas');
  c.width=c.height=s;
  const g=c.getContext('2d');
  const r=discR, cx=s/2, cy=s/2;
  // body
  const grad=g.createRadialGradient(cx-r*0.35, cy-r*0.4, r*0.1, cx, cy, r);
  grad.addColorStop(0, colorA);
  grad.addColorStop(0.55, colorB);
  grad.addColorStop(1, rim);
  g.fillStyle=grad;
  g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.fill();
  // rim light
  g.strokeStyle='rgba(255,255,255,.65)';
  g.lineWidth=Math.max(1.5, r*0.06);
  g.beginPath(); g.arc(cx,cy,r-g.lineWidth/2,0,Math.PI*2); g.stroke();
  // specular crescent
  g.fillStyle='rgba(255,255,255,.85)';
  g.beginPath();
  g.ellipse(cx-r*0.34, cy-r*0.42, r*0.30, r*0.17, -0.6, 0, Math.PI*2);
  g.fill();
  g.fillStyle='rgba(255,255,255,.35)';
  g.beginPath();
  g.ellipse(cx+r*0.30, cy+r*0.38, r*0.22, r*0.12, -0.6, 0, Math.PI*2);
  g.fill();
  return c;
}
function bakeSprites(){
  sprites[CFG.HUMAN]=bakeOrb('#d9fbff','#38c8ee','#0e7fa3');
  sprites[CFG.AI]=bakeOrb('#fff3d6','#f5b93c','#b06f0e');
  const g=bakeOrb('#d9fbff','#38c8ee','#0e7fa3');
  // ghost: same orb, drawn translucent at render time
  sprites.ghost=g;
}

/* ---------- Game state ---------- */
const S = {
  board: newBoard(),
  turn: CFG.HUMAN,
  falling: null,      // {col,row,player,t,fromY}
  over: false,
  result: null,       // {player|'draw', cells?}
  winPulse: 0,
  hitstop: 0,
  hoverCol: -1,
  aiTimer: 0,
  aiThinking: false,
  endT: 0,
  bubbles: [],
  particles: [],
  rings: [],
  shake: 0,
};
const scores = loadScores();
function loadScores(){
  try{
    const raw = localStorage.getItem('c4-scores-v1');
    if(raw){
      const o = JSON.parse(raw);
      if(o && typeof o.you==='number' && typeof o.ai==='number' && typeof o.draw==='number') return o;
    }
  }catch(e){ /* corrupted: reset */ }
  return {you:0, ai:0, draw:0};
}
function saveScores(){
  try{ localStorage.setItem('c4-scores-v1', JSON.stringify(scores)); }catch(e){}
}
function updateScoreUI(){
  document.getElementById('sYou').textContent = scores.you;
  document.getElementById('sAi').textContent = scores.ai;
  document.getElementById('sDraw').textContent = scores.draw;
}

// ambient bubbles
function initBubbles(){
  S.bubbles=[];
  for(let i=0;i<26;i++){
    S.bubbles.push({
      x: Math.random()*VW, y: Math.random()*VH,
      r: 2+Math.random()*7, sp: 14+Math.random()*30,
      wob: Math.random()*Math.PI*2, a: 0.10+Math.random()*0.22,
    });
  }
}
function spawnRipple(x,y,color){
  if(S.rings.length>12) S.rings.shift();
  S.rings.push({x:x,y:y,r:discR*0.5,maxR:discR*1.5,t:0,dur:0.45,color:color});
}
function spawnWinBurst(){
  const w=S.result;
  if(!w || !w.cells) return;
  w.cells.forEach(function(rc, i){
    const p=cellCenter(rc[1], rc[0]);
    for(let k=0;k<10;k++){
      if(S.particles.length>150) S.particles.shift();
      const a=Math.random()*Math.PI*2, sp=60+Math.random()*140;
      S.particles.push({
        x:p.x, y:p.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40,
        t:0, dur:0.7+Math.random()*0.4, r:2+Math.random()*3,
        color: w.player===CFG.HUMAN ? '#8fe9ff' : '#ffd97a',
        delay: i*0.06,
      });
    }
  });
}

function cellCenter(c, r){
  return {x: boardX + c*cell + cell/2, y: boardY + r*cell + cell/2};
}
function colFromX(x){
  const c = Math.floor((x-boardX)/cell);
  return (c>=0 && c<CFG.COLS) ? c : -1;
}

/* ---------- Turn flow ---------- */
function humanDrop(col){
  if(S.over || S.falling || S.turn!==CFG.HUMAN || S.aiThinking) return;
  startDrop(col, CFG.HUMAN);
  AudioX.click();
}
function aiDrop(){
  if(S.over) return;
  S.aiThinking=true;
  S.aiTimer=0.35; // brief beat so the player sees the AI thinking
}
function startDrop(col, player){
  const r = dropRow(S.board, col);
  if(r<0) return;
  const target = cellCenter(col, r);
  S.falling = {
    col:col, row:r, player:player, t:0,
    fromY: boardY - cell*1.1, toY: target.y,
  };
  S.board[r][col] = player; // reserve the slot now
}
function finishDrop(){
  const f=S.falling;
  S.falling=null;
  const p=cellCenter(f.col, f.row);
  AudioX.land();
  spawnRipple(p.x, p.y, f.player===CFG.HUMAN ? 'rgba(140,235,255,.8)' : 'rgba(255,215,120,.8)');
  const win = checkWin(S.board);
  if(win){
    endGame(win);
  } else if(isFull(S.board)){
    endGame({player:'draw'});
  } else {
    S.turn = (S.turn===CFG.HUMAN) ? CFG.AI : CFG.HUMAN;
    if(S.turn===CFG.AI) aiDrop();
  }
}
function endGame(result){
  S.over=true;
  S.result=result;
  S.hitstop=CFG.HITSTOP_MS/1000;
  S.winPulse=0; S.endT=0; S.shake = result.player==='draw' ? 0 : 5;
  spawnWinBurst();
  if(result.player===CFG.HUMAN){ scores.you++; AudioX.win(); }
  else if(result.player===CFG.AI){ scores.ai++; AudioX.lose(); }
  else { scores.draw++; AudioX.drawS(); }
  saveScores(); updateScoreUI();
}
function newRound(){
  S.board=newBoard();
  S.turn=CFG.HUMAN;
  S.falling=null; S.over=false; S.result=null;
  S.winPulse=0; S.hitstop=0; S.endT=0; S.shake=0;
  S.aiThinking=false; S.particles=[]; S.rings=[];
  if(S.turn===CFG.AI) aiDrop();
}

/* ---------- Easing ---------- */
function easeOutBounce(x){
  const n1=7.5625, d1=2.75;
  if(x<1/d1) return n1*x*x;
  if(x<2/d1) return n1*(x-=1.5/d1)*x+0.75;
  if(x<2.5/d1) return n1*(x-=2.25/d1)*x+0.9375;
  return n1*(x-=2.625/d1)*x+0.984375;
}
function easeOutBack(x){
  const c1=1.70158, c3=c1+1;
  return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2);
}

/* ---------- Update (fixed timestep) ---------- */
function update(dt){
  // hit-stop: freeze sim, keep rendering
  if(S.hitstop>0){ S.hitstop-=dt; return; }

  // ambient bubbles rise
  for(let i=0;i<S.bubbles.length;i++){
    const b=S.bubbles[i];
    b.y -= b.sp*dt;
    b.wob += dt*1.4;
    if(b.y < -20){ b.y = VH+20; b.x = Math.random()*VW; }
  }
  // particles
  for(let i=S.particles.length-1;i>=0;i--){
    const p=S.particles[i];
    if(p.delay>0){ p.delay-=dt; continue; }
    p.t+=dt;
    if(p.t>=p.dur){ S.particles.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=160*dt;
  }
  // rings
  for(let i=S.rings.length-1;i>=0;i--){
    const r=S.rings[i];
    r.t+=dt;
    if(r.t>=r.dur) S.rings.splice(i,1);
  }
  if(S.shake>0) S.shake=Math.max(0, S.shake-dt*22);

  // falling disc
  if(S.falling){
    const f=S.falling;
    f.t += dt*1000;
    if(f.t>=CFG.DROP_MS) finishDrop();
  }
  // AI turn
  if(S.aiThinking && !S.over && !S.falling){
    S.aiTimer-=dt;
    if(S.aiTimer<=0){
      S.aiThinking=false;
      const col=bestMove(S.board, CFG.AI);
      startDrop(col, CFG.AI);
    }
  }
  if(S.over) S.endT+=dt;
  S.winPulse+=dt;
}

/* ---------- Render ---------- */
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function drawBoardPanel(){
  const bw=cell*CFG.COLS, bh=cell*CFG.ROWS;
  const x=boardX-14, y=boardY-14, w=bw+28, h=bh+28, r=26;
  ctx.save();
  if(S.shake>0) ctx.translate(Math.sin(S.winPulse*70)*S.shake, Math.cos(S.winPulse*55)*S.shake*0.6);
  // glass body: sharp layered gradients, no blur
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'rgba(190,240,255,.34)');
  g.addColorStop(0.18,'rgba(120,200,235,.20)');
  g.addColorStop(0.5,'rgba(40,120,160,.16)');
  g.addColorStop(1,'rgba(8,40,60,.42)');
  roundRect(ctx,x,y,w,h,r);
  ctx.fillStyle=g; ctx.fill();
  // gloss: top 50% with curved bottom edge
  ctx.save();
  roundRect(ctx,x,y,w,h,r); ctx.clip();
  const gl=ctx.createLinearGradient(0,y,0,y+h*0.5);
  gl.addColorStop(0,'rgba(255,255,255,.38)');
  gl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gl;
  ctx.beginPath();
  ctx.ellipse(x+w/2, y+h*0.06, w*0.62, h*0.30, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  // edges: bright top, white 1px border
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5;
  roundRect(ctx,x,y,w,h,r); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x+r,y+2); ctx.lineTo(x+w-r,y+2); ctx.stroke();
  // slots
  for(let rr=0;rr<CFG.ROWS;rr++){
    for(let cc=0;cc<CFG.COLS;cc++){
      const p=cellCenter(cc,rr);
      ctx.fillStyle='rgba(4,26,40,.55)';
      ctx.beginPath(); ctx.arc(p.x,p.y,discR,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(160,225,250,.28)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,discR,0,Math.PI*2); ctx.stroke();
      // inner top shade for depth
      ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,discR-2,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawDiscAt(x, y, player, scale, alpha){
  const spr=sprites[player];
  const s=spr.width;
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(scale,scale);
  ctx.drawImage(spr, -s/2, -s/2);
  ctx.restore();
}
function drawDiscs(){
  const wonCells = (S.over && S.result && S.result.cells) ? S.result.cells : null;
  const wonSet = wonCells ? new Set(wonCells.map(function(rc){return rc[0]+','+rc[1];})) : null;
  for(let r=0;r<CFG.ROWS;r++){
    for(let c=0;c<CFG.COLS;c++){
      const p=S.board[r][c];
      if(p===0) continue;
      // skip the disc currently falling (drawn separately)
      if(S.falling && S.falling.row===r && S.falling.col===c) continue;
      const pos=cellCenter(c,r);
      let scale=1;
      if(wonSet && wonSet.has(r+','+c)){
        scale = 1 + 0.10*Math.sin(S.winPulse*7);
      }
      drawDiscAt(pos.x, pos.y, p, scale, 1);
    }
  }
  // falling disc
  if(S.falling){
    const f=S.falling;
    const t=Math.min(f.t/CFG.DROP_MS, 1);
    const y=f.fromY + (f.toY-f.fromY)*easeOutBounce(t);
    const p=cellCenter(f.col, f.row);
    drawDiscAt(p.x, y, f.player, 1, 1);
  }
  // hover ghost
  if(!S.over && !S.falling && S.turn===CFG.HUMAN && S.hoverCol>=0 && dropRow(S.board,S.hoverCol)>=0){
    const p=cellCenter(S.hoverCol, 0);
    drawDiscAt(p.x, boardY-cell*0.62, CFG.HUMAN, 0.9, 0.45);
  }
}
function drawWinLine(){
  const w=S.result;
  if(!w || !w.cells || w.player==='draw') return;
  const a=cellCenter(w.cells[0][1], w.cells[0][0]);
  const b=cellCenter(w.cells[3][1], w.cells[3][0]);
  const pulse=0.55+0.35*Math.sin(S.winPulse*7);
  ctx.save();
  ctx.globalAlpha=pulse;
  ctx.strokeStyle = w.player===CFG.HUMAN ? '#aef4ff' : '#ffe3a1';
  ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.globalAlpha=pulse*0.5;
  ctx.lineWidth=14;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.restore();
  // expanding impact rings from the line center
  const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
  const rt=(S.winPulse*1.4)%1;
  ctx.save();
  ctx.globalAlpha=(1-rt)*0.7;
  ctx.strokeStyle = w.player===CFG.HUMAN ? '#aef4ff' : '#ffe3a1';
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx,cy,20+rt*90,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function drawRings(){
  for(let i=0;i<S.rings.length;i++){
    const r=S.rings[i], t=r.t/r.dur;
    ctx.save();
    ctx.globalAlpha=(1-t)*0.8;
    ctx.strokeStyle=r.color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r+(r.maxR-r.r)*t, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}
function drawParticles(){
  for(let i=0;i<S.particles.length;i++){
    const p=S.particles[i];
    if(p.delay>0) continue;
    const t=p.t/p.dur;
    ctx.save();
    ctx.globalAlpha=1-t;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1-t*0.5),0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawBubbles(){
  ctx.save();
  for(let i=0;i<S.bubbles.length;i++){
    const b=S.bubbles[i];
    const x=b.x+Math.sin(b.wob)*10;
    ctx.globalAlpha=b.a;
    ctx.strokeStyle='#bfefff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,b.y,b.r,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=b.a*0.9;
    ctx.fillStyle='#e8fbff';
    ctx.beginPath(); ctx.arc(x-b.r*0.3,b.y-b.r*0.3,Math.max(1,b.r*0.22),0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
/* Inky the squid: small cameo, mood = happy | sad | meh */
function drawInky(x, y, s, mood){
  ctx.save();
  ctx.translate(x,y);
  const bob = mood==='happy' ? Math.sin(S.endT*8)*s*0.06 : 0;
  ctx.translate(0,bob);
  const body='#b9a7f2', dark='#7c63c7';
  // tentacles
  ctx.strokeStyle=body; ctx.lineCap='round'; ctx.lineWidth=s*0.10;
  for(let i=-2;i<=2;i++){
    const tx=i*s*0.20;
    const lift = mood==='happy' ? -s*0.30 : (mood==='sad' ? s*0.05 : -s*0.10);
    const droop = mood==='sad' ? s*0.28 : s*0.10;
    ctx.beginPath();
    ctx.moveTo(tx, s*0.28);
    ctx.quadraticCurveTo(tx+ (mood==='happy'? i*s*0.06 : 0), s*0.28+lift+droop*0.4, tx*1.25, s*0.28+lift+droop);
    ctx.stroke();
  }
  // body dome
  const g=ctx.createLinearGradient(0,-s*0.5,0,s*0.35);
  g.addColorStop(0,'#d9ccff'); g.addColorStop(0.6,body); g.addColorStop(1,dark);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-s*0.42, s*0.30);
  ctx.quadraticCurveTo(-s*0.50, -s*0.28, 0, -s*0.52);
  ctx.quadraticCurveTo(s*0.50, -s*0.28, s*0.42, s*0.30);
  ctx.quadraticCurveTo(0, s*0.12, -s*0.42, s*0.30);
  ctx.fill();
  // head fins
  ctx.fillStyle=dark;
  ctx.beginPath(); ctx.ellipse(-s*0.48,-s*0.30,s*0.16,s*0.10,-0.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s*0.48,-s*0.30,s*0.16,s*0.10,0.5,0,Math.PI*2); ctx.fill();
  // eyes
  const ey = mood==='sad' ? s*0.02 : -s*0.08;
  [-1,1].forEach(function(side){
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(side*s*0.18, ey, s*0.13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#1c2b3a';
    const px = mood==='meh' ? 0 : side*s*0.03;
    const py = mood==='sad' ? s*0.03 : (mood==='happy' ? -s*0.02 : 0);
    ctx.beginPath(); ctx.arc(side*s*0.18+px, ey+py, s*0.06, 0, Math.PI*2); ctx.fill();
  });
  // mouth
  ctx.strokeStyle='#3a2f5e'; ctx.lineWidth=s*0.045; ctx.lineCap='round';
  ctx.beginPath();
  if(mood==='happy') ctx.arc(0, -s*0.02, s*0.14, 0.25, Math.PI-0.25);
  else if(mood==='sad') ctx.arc(0, s*0.22, s*0.12, Math.PI+0.3, -0.3);
  else { ctx.moveTo(-s*0.10, s*0.10); ctx.lineTo(s*0.10, s*0.10); }
  ctx.stroke();
  ctx.restore();
}
function drawEndOverlay(){
  const w=S.result;
  if(!w) return;
  const t=Math.min(S.endT/0.35, 1);
  const pop=easeOutBack(t);
  ctx.save();
  ctx.globalAlpha=Math.min(1, S.endT*3)*0.72;
  ctx.fillStyle='#03141f';
  ctx.fillRect(0,0,VW,VH);
  ctx.restore();

  const pw=Math.min(VW-48, 420), ph=250;
  const px=(VW-pw)/2, py=(VH-ph)/2;
  ctx.save();
  ctx.translate(VW/2, VH/2);
  ctx.scale(pop,pop);
  ctx.translate(-VW/2, -VH/2);
  // glass panel
  const g=ctx.createLinearGradient(0,py,0,py+ph);
  g.addColorStop(0,'rgba(190,240,255,.30)');
  g.addColorStop(0.4,'rgba(60,140,180,.22)');
  g.addColorStop(1,'rgba(8,40,60,.55)');
  roundRect(ctx,px,py,pw,ph,22);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5;
  roundRect(ctx,px,py,pw,ph,22); ctx.stroke();

  const title = w.player===CFG.HUMAN ? 'YOU WIN' : (w.player===CFG.AI ? 'AI WINS' : 'DRAW');
  const sub = w.player===CFG.HUMAN ? 'Clean sweep. Four in a row.'
    : (w.player===CFG.AI ? 'The machine takes this one. Run it back.'
    : 'Board is full. Nobody blinked.');
  const mood = w.player===CFG.HUMAN ? 'happy' : (w.player===CFG.AI ? 'sad' : 'meh');
  ctx.textAlign='center';
  ctx.fillStyle='#ffffff';
  ctx.font='800 34px "Segoe UI", system-ui, sans-serif';
  ctx.fillText(title, VW/2, py+58);
  ctx.font='400 15px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle='rgba(234,252,255,.85)';
  ctx.fillText(sub, VW/2, py+86);
  drawInky(VW/2, py+160, 44, mood);
  // tap-to-continue hint
  ctx.font='700 12px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle='rgba(234,252,255,.6)';
  ctx.fillText('TAP TO PLAY AGAIN', VW/2, py+ph-18);
  ctx.restore();
}
function drawThinking(){
  if(!S.aiThinking || S.over) return;
  ctx.save();
  ctx.textAlign='center';
  ctx.font='700 13px "Segoe UI", system-ui, sans-serif';
  const a=0.45+0.35*Math.sin(S.winPulse*8);
  ctx.fillStyle='rgba(255,215,120,'+a.toFixed(2)+')';
  ctx.fillText('AI IS THINKING', VW/2, boardY-34);
  ctx.restore();
}
function drawColumnHint(){
  if(S.over || S.falling || S.turn!==CFG.HUMAN) return;
  if(S.hoverCol<0) return;
  ctx.save();
  ctx.globalAlpha=0.16;
  ctx.fillStyle='#8fe9ff';
  ctx.fillRect(boardX+S.hoverCol*cell, boardY-8, cell, cell*CFG.ROWS+16);
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,VW,VH);
  drawBubbles();
  drawColumnHint();
  drawBoardPanel();
  drawDiscs();
  drawRings();
  drawParticles();
  drawWinLine();
  drawThinking();
  drawEndOverlay();
}

/* ---------- Input: bound once ---------- */
function onPointerMove(e){
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left);
  S.hoverCol=colFromX(x);
}
function onPointerDown(e){
  AudioX.unlock();
  if(S.over){ newRound(); return; }
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left);
  const c=colFromX(x);
  if(c>=0) humanDrop(c);
}
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('keydown', function(e){
  if(e.key>='1' && e.key<='7'){ AudioX.unlock(); humanDrop(parseInt(e.key,10)-1); }
  else if(e.key==='r' || e.key==='R'){ newRound(); }
});
document.getElementById('btnNew').addEventListener('click', function(){
  AudioX.unlock(); AudioX.click(); newRound();
});
document.getElementById('btnMute').addEventListener('click', function(){
  AudioX.unlock();
  const muted=AudioX.toggleMute();
  this.textContent = muted ? 'SOUND OFF' : 'SOUND ON';
});

/* ---------- Main loop: fixed timestep, rAF booted properly ---------- */
let lastTs=0, acc=0;
function gameLoop(ts){
  if(typeof ts!=='number' || isNaN(ts)) ts=lastTs||0;
  let dt=(ts-lastTs)/1000;
  lastTs=ts;
  if(dt>0.25) dt=0.25;
  acc+=dt;
  let steps=0;
  while(acc>=CFG.FIXED_DT && steps<5){
    update(CFG.FIXED_DT);
    acc-=CFG.FIXED_DT;
    steps++;
  }
  render();
  requestAnimationFrame(gameLoop);
}

/* ---------- Boot ---------- */
resize();
initBubbles();
updateScoreUI();
newRound();
window.__c4 = {S:S, CFG:CFG, newRound:newRound, humanDrop:humanDrop, bestMove:bestMove, checkWin:checkWin, newBoard:newBoard,
  geom:function(){ return {boardX:boardX, boardY:boardY, cell:cell, VW:VW, VH:VH}; }};
requestAnimationFrame(gameLoop);

})();
}
</script>
